# Test, then deploy to a Hugging Face Docker Space on every push to master.
# Needs: repository variable HF_SPACE (e.g. yourname/zerorot) and secret HF_TOKEN (Hugging Face token with write access).
name: Test and deploy to Hugging Face

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          cd backend && python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check and build
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx tsc -b
          npm run build

  deploy:
    needs: test
    if: vars.HF_SPACE != ''   # skipped until the Space is configured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push a clean snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -e
          test -n "$HF_TOKEN" || { echo "Add the HF_TOKEN secret"; exit 1; }
          test -n "$HF_SPACE" || { echo "Add the HF_SPACE variable (yourname/zerorot)"; exit 1; }
          mkdir /tmp/space
          git archive HEAD | tar -x -C /tmp/space
          cd /tmp/space
          # Space settings header (Hugging Face reads it from README.md)
          {
            echo "---"
            echo "title: ZERO ROT"
            echo "emoji: 🍅"
            echo "colorFrom: green"
            echo "colorTo: red"
            echo "sdk: docker"
            echo "app_port: 8000"
            echo "pinned: false"
            echo "short_description: Post-harvest digital twin for Indian farmers"
            echo "---"
            echo
            cat README.md
          } > README.space.md && mv README.space.md README.md
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Pushed. The Space is rebuilding: https://huggingface.co/spaces/${HF_SPACE}"
